<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Body Visualiser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; overflow: hidden; width: 100vw; height: 100vh; }
    #container { width: 100%; height: 100%; }
    #loading {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #c4b5fd;
      font-family: system-ui, sans-serif; font-size: 14px; gap: 16px; pointer-events: none;
    }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(167,139,250,0.2);
      border-top-color: #7c3aed; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="container"></div>
<div id="loading"><div class="spinner"></div>Loading body model…</div>
<script src="https://cdn.jsdelivr.net/gh/OpnTec/bodyapps-viz@master/js/three.js"></script>
<script src="https://cdn.jsdelivr.net/gh/OpnTec/bodyapps-viz@master/js/UCSCharacter.js"></script>
<script src="https://cdn.jsdelivr.net/gh/OpnTec/bodyapps-viz@master/js/Orbit.js"></script>
<script>
  var CDN='https://cdn.jsdelivr.net/gh/OpnTec/bodyapps-viz@master/';
  var W=window.innerWidth,H=window.innerHeight;
  var camera=new THREE.PerspectiveCamera(28,W/H,1,100000);
  camera.position.set(0,3100,3800);
  var scene=new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff,0.5));
  var dir=new THREE.DirectionalLight(0xffffff,1.1);dir.position.set(8,12,8);scene.add(dir);
  var fill=new THREE.DirectionalLight(0xa78bfa,0.35);fill.position.set(-8,4,-6);scene.add(fill);
  var renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(window.devicePixelRatio);renderer.setSize(W,H);
  renderer.setClearColor(0x000000,0);
  document.getElementById('container').appendChild(renderer.domElement);
  var controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.target.set(0,3000,0);controls.minDistance=1500;controls.maxDistance=8000;
  controls.minPolarAngle=0.1;controls.maxPolarAngle=Math.PI*0.9;
  controls.enablePan=false;controls.autoRotate=true;controls.autoRotateSpeed=1.0;
  controls.addEventListener('change',render);
  var femaleConfig={baseUrl:CDN+'models/skinned/UCS/',character:'female.js',
    skins:['Highlighted_Muscles.jpg'],
    morphs:['Height','Neck Height','Neck','Shoulders','Shoulder Angle','Breast','Bust Girth','Arm Length','Upper Arm Girth','Wrist','Stomach Form','Waist','Hip Girth','Hip Height','Thigh Girth','Calf Girth','lower Leg'],
    morphslimit:[155,7,31,14,1,85,66,23,27,14,1,75,100,82,58,36,45],
    morphslowlimit:[110,5,27,12,0,70,56,16,22,9,0,65,86,72,49,26,39],
    morphshighlimit:[210,9,35,16,2,100,76,27,32,18,2,85,114,92,66,44,53],
    x:0,y:2400,z:0,s:70};
  var pendingMeasurements=null;
  var character=new THREE.UCSCharacter();
  character.onLoadComplete=function(){
    document.getElementById('loading').style.display='none';
    var mesh=character.root.children[0];
    if(mesh)mesh.material=new THREE.MeshLambertMaterial({color:0xc8a882,morphTargets:true,skinning:false});
    window.parent.postMessage({type:'bodyReady'},'*');
    if(pendingMeasurements){applyMeasurements(pendingMeasurements);pendingMeasurements=null;}
  };
  character.loadParts(femaleConfig);scene.add(character.root);
  function applyMeasurements(m){
    var v={};
    if(m.heightCm) v['Height']=clamp(m.heightCm,110,210);
    if(m.chestCm){v['Breast']=clamp(m.chestCm,70,100);v['Bust Girth']=clamp(m.chestCm*0.77,56,76);}
    if(m.waistCm) v['Waist']=clamp(m.waistCm,65,85);
    if(m.hipsCm)  v['Hip Girth']=clamp(m.hipsCm,86,114);
    if(m.thighsCm)v['Thigh Girth']=clamp(m.thighsCm,49,66);
    if(m.armsCm)  v['Upper Arm Girth']=clamp(m.armsCm,22,32);
    for(var i=0;i<femaleConfig.morphs.length;i++){var n=femaleConfig.morphs[i];if(!(n in v))v[n]=femaleConfig.morphslimit[i];}
    character.updateMorphs(v);
  }
  function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,Number(v)));}
  window.addEventListener('message',function(e){
    if(!e.data||e.data.type!=='updateMeasurements')return;
    if(character.numMorphs>0)applyMeasurements(e.data.measurements);
    else pendingMeasurements=e.data.measurements;
  });
  window.addEventListener('resize',function(){W=window.innerWidth;H=window.innerHeight;
    camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H);render();});
  function animate(){requestAnimationFrame(animate);controls.update();render();}
  function render(){renderer.render(scene,camera);}
  animate();
</script>
</body>
</html>
